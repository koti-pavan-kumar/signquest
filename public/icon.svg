<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Hand icon -->
  <g transform="translate(156, 120)" fill="white">
    <!-- Palm -->
    <rect x="40" y="160" width="120" height="110" rx="20" opacity="0.95"/>
    <!-- Thumb -->
    <rect x="10" y="170" width="40" height="22" rx="11" transform="rotate(-15 10 170)" opacity="0.95"/>
    <!-- Index -->
    <rect x="55" y="60" width="22" height="110" rx="11" opacity="0.95"/>
    <!-- Middle -->
    <rect x="90" y="40" width="22" height="130" rx="11" opacity="0.95"/>
    <!-- Ring -->
    <rect x="125" y="55" width="22" height="115" rx="11" opacity="0.95"/>
    <!-- Pinky -->
    <rect x="160" y="80" width="20" height="90" rx="10" opacity="0.95"/>
  </g>
  <!-- Sign text -->
  <text x="256" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="72" fill="white" opacity="0.95">🤟</text>
  <text x="256" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="48" fill="white" opacity="0.8">SignQuest</text>
</svg>
